<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동작 만들기 · Virtually</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./animate.css">
  <link rel="stylesheet" href="./auth.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <a href="./" class="back-link">← 메인으로</a>
      <h1>동작 만들기</h1>
      <div id="authSlot" class="auth-slot" hidden></div>
    </header>

    <p id="globalStatus" class="bar bar-warn" role="alert" hidden></p>

    <!-- 1. Driving video -->
    <section class="card" aria-labelledby="drivingTitle">
      <h2 id="drivingTitle">1. 동작 영상</h2>
      <div id="exampleBar" class="bar" hidden>
        <span>예시 영상이 아직 없습니다</span>
        <button type="button" id="fetchExamplesBtn" class="btn btn-sm">예시 영상 받기</button>
      </div>
      <div class="strip" data-strip>
        <div id="drivingList" class="strip-scroller" role="radiogroup" aria-labelledby="drivingTitle">
          <div class="strip-lead">
            <button type="button" id="drivingDrop" class="dropzone dropzone-video" aria-label="내 영상 올리기: 끌어다 놓거나 눌러서 고르기">
              <svg class="dropzone-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="3" y="5" width="13" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
                <path d="M16 10.2 21 7v10l-5-3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M9.5 9v6M6.5 12h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              <span class="dropzone-title" id="drivingDropTitle">+ 내 영상 올리기</span>
              <span class="dropzone-sub">끌어다 놓기 · MP4 · MOV · WebM</span>
            </button>
          </div>
          <span id="drivingSentinel" class="strip-sentinel" aria-hidden="true"></span>
        </div>
      </div>
      <button type="button" id="restoreExamplesBtn" class="text-btn" hidden></button>
      <input type="file" id="drivingInput" accept="video/mp4,video/quicktime,video/webm" multiple hidden>
      <p id="drivingStatus" class="status" aria-live="polite"></p>
      <video id="drivingPreview" class="driving-preview" muted loop autoplay playsinline controls hidden></video>
    </section>

    <!-- 2. Character -->
    <section id="characterCard" class="card" aria-labelledby="characterTitle">
      <h2 id="characterTitle">2. 캐릭터</h2>
      <div class="strip" data-strip>
        <div id="characterList" class="strip-scroller" role="list" aria-labelledby="characterTitle">
          <div class="strip-lead">
            <button type="button" id="characterDrop" class="dropzone dropzone-image" aria-label="캐릭터 이미지 올리기: 끌어다 놓거나, 눌러서 고르거나, 붙여넣기">
              <svg class="dropzone-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M7 17.5h-.5a4 4 0 0 1-.6-7.95A6 6 0 0 1 17.6 8.1 4.5 4.5 0 0 1 17.5 17.5H17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 20v-8m0 0-3 3m3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="dropzone-title" id="characterDropTitle">이미지를 끌어다 놓으세요</span>
              <span class="dropzone-sub">클릭해서 고르기 · 붙여넣기(⌘V / Ctrl+V) · PNG · JPG · WebP</span>
            </button>
          </div>
        </div>
      </div>
      <p id="characterMeta" class="muted character-meta"></p>
      <input type="file" id="characterInput" accept="image/png,image/jpeg,image/webp" multiple hidden>
      <p id="characterStatus" class="status" aria-live="polite"></p>
    </section>

    <!-- 3. Model -->
    <section class="card" aria-labelledby="modelTitle">
      <h2 id="modelTitle">3. 모델</h2>
      <div id="routeList" class="route-list"></div>
      <div id="routeOptions" class="route-options"></div>
      <div id="marginBox" class="route-margin" hidden>
        <div class="route-option">
          <label for="marginSelect">여백</label>
          <select id="marginSelect" class="select-sm"></select>
        </div>
        <p class="muted route-margin-hint">캐릭터가 화면 밖으로 나가 잘리지 않게 동작 영상 둘레(아래 제외)에 여백을 붙입니다. 넓을수록 캐릭터가 작게 만들어집니다.</p>
      </div>
      <details id="keyPanel" class="key-panel">
        <summary>API 키 설정</summary>
        <div id="keyList" class="key-list"></div>
      </details>
    </section>

    <div class="create-row">
      <button type="button" id="createBtn" class="btn btn-primary" disabled>동작 만들기</button>
      <p id="createStatus" class="status" aria-live="polite"></p>
    </div>

    <!-- 4. Results -->
    <section class="card" aria-labelledby="resultTitle">
      <h2 id="resultTitle">4. 결과</h2>
      <p id="jobsEmpty" class="muted">아직 없습니다</p>
      <ol id="jobList" class="job-list"></ol>
    </section>
  </main>

  <dialog id="confirmDialog" class="confirm" aria-labelledby="confirmTitle">
    <form method="dialog">
      <h2 id="confirmTitle">만들까요?</h2>
      <dl class="confirm-list">
        <div><dt>모델</dt><dd id="confirmModel"></dd></div>
        <div><dt>영상 길이</dt><dd id="confirmLength"></dd></div>
        <div><dt>예상 비용</dt><dd id="confirmCost"></dd></div>
      </dl>
      <p id="confirmCredits" class="confirm-credits" hidden></p>
      <div class="row row-end">
        <button type="submit" value="cancel" class="btn btn-ghost">취소</button>
        <button type="submit" value="ok" class="btn btn-primary">만들기</button>
      </div>
    </form>
  </dialog>

  <script src="./auth.js"></script>
  <script src="./motions.js"></script>
  <script src="./credits.js"></script>
  <script src="./animate.js"></script>
</body>
</html>
