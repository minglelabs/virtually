<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtually 컨트롤러</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main class="layout">
    <!-- 왼쪽: 컨트롤 영역 -->
    <section class="pane pane-control" aria-labelledby="controlTitle">
      <h1 id="controlTitle">Virtually</h1>

      <article class="card">
        <h2>OBS 브라우저 소스 연동</h2>
        <p>OBS에서 <strong>소스 추가 → 브라우저</strong>를 고르고 아래 URL을 넣으세요.</p>
        <div class="url-box">
          <label for="overlayUrlInput" class="visually-hidden">OBS 오버레이 URL</label>
          <input type="text" id="overlayUrlInput" readonly>
          <button type="button" id="copyUrlBtn" class="btn">URL 복사</button>
        </div>
        <ul class="tips">
          <li>너비 × 높이: 1920 × 1080</li>
          <li>'표시되지 않을 때 소스 종료'는 끄기</li>
          <li>배경은 투명합니다. 카메라 소스 위에 배치하세요.</li>
        </ul>
        <a href="./overlay" target="_blank" rel="noopener noreferrer" class="link">오버레이 새 창으로 열기</a>
      </article>
    </section>

    <!-- 오른쪽: 오버레이 실시간 미리보기 -->
    <section class="pane pane-preview" aria-labelledby="previewTitle">
      <header class="preview-header">
        <h2 id="previewTitle">오버레이 실시간 미리보기</h2>
        <button type="button" id="refreshOverlayBtn" class="btn btn-ghost">새로고침</button>
      </header>
      <div class="stage">
        <iframe id="overlayPreviewFrame" src="./overlay" title="OBS 오버레이 미리보기"></iframe>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
