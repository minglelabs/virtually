<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 · Virtually</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
      <header class="login-header">
        <h1 class="brand">Virtually</h1>
        <p class="subtitle">OBS 캐릭터 오버레이</p>
      </header>
      <h2 id="loginTitle" class="login-title">로그인</h2>

      <!-- Google "Sign in with Google" button, dark theme, pill shape. login.js sets ?next. -->
      <a id="googleLoginBtn" class="gsi-button" href="/auth/google/login?next=%2F">
        <svg class="gsi-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.5-1.45-.78-2.99-.78-4.59s.27-3.14.78-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        <span class="gsi-label">Google 계정으로 로그인</span>
      </a>

      <div id="loginMessage" class="login-message" role="alert"></div>
      <a id="controllerLink" class="login-link" href="/" hidden>컨트롤러로 가기</a>
      <div id="loginHelp" class="login-help" hidden></div>
    </section>
  </main>
  <script src="./login.js"></script>
</body>
</html>
